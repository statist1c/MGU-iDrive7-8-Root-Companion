plugins { id 'com.android.application'; id 'com.chaquo.python' }
android {
    namespace 'dev.mgu.standalone'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.mgu.standalone'
        minSdk 26; targetSdk 35; versionCode 8; versionName '0.9.1'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        testInstrumentationRunner 'dev.mgu.standalone.RuntimeSmokeTest'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/backendAssets')
    packaging { resources { excludes += ['META-INF/versions/**', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'] } }
}
chaquopy {
    defaultConfig {
        version = '3.13'
        if (project.hasProperty('standaloneBuildPython')) {
            buildPython(project.property('standaloneBuildPython').toString())
        }
        // Install Python 3.13 on the build computer. The app embeds its own runtime.
        pip {
            install 'cryptography==42.0.8'
            // Preserve the transitive runtime versions audited in the notice bundle.
            install 'cffi==1.17.1'
            install 'pycparser==3.12'
            install 'chaquopy-libffi==3.3'
        }
    }
}
dependencies {
    implementation 'com.github.mwiede:jsch:2.28.8'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.87'
}
tasks.register('packageBackend', Zip) {
    from(rootProject.file('../vendor/upstream')) {
        include 'ssh_enable.py', 'sshd-always-on.sh', 'mgu7/**', 'data/assets/**', 'LICENSE'
        exclude '**/__pycache__/**', '**/*.pyc'
    }
    archiveFileName = 'backend.zip'
    destinationDirectory = layout.buildDirectory.dir('generated/backendAssets')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('preBuild').configure { dependsOn 'packageBackend' }

// Licensing and source fingerprints are packaged without changing upstream assets.
def companionRoot = rootProject.projectDir.parentFile
def noticeAssets = layout.buildDirectory.dir('generated/licenseAssets')
def sourceAssets = layout.buildDirectory.dir('generated/sourceAssets')
android.sourceSets.main.assets.srcDir noticeAssets
android.sourceSets.main.assets.srcDir sourceAssets

tasks.register('packageLicenseNotices', Sync) {
    from(companionRoot) {
        include 'LICENSE', 'NOTICE', 'THIRD-PARTY.md', 'LICENSING.md', 'licenses/**'
    }
    into noticeAssets.map { it.dir('license-notices') }
}
tasks.register('generateSourceManifest') {
    outputs.upToDateWhen { false }
    doLast {
        def files = fileTree(companionRoot) {
            include 'android/app/src/main/**', 'android/*.gradle', 'android/gradle.properties'
            include 'android/gradle/**', 'android/gradlew', 'android/gradlew.bat', 'vendor/upstream/**'
            include 'LICENSE', 'NOTICE', 'THIRD-PARTY.md', 'LICENSING.md', 'licenses/**'
            exclude '**/__pycache__/**', '**/*.pyc', '**/logs/**', '**/enrollments/**'
        }
        def hashes = new TreeMap<String, String>()
        files.files.each { f ->
            def path = companionRoot.toPath().relativize(f.toPath()).toString().replace('\\', '/')
            hashes[path] = java.security.MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString()
        }
        def target = sourceAssets.get().file('source-manifest.json').asFile
        target.parentFile.mkdirs()
        target.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
            format: 1, versionName: android.defaultConfig.versionName,
            versionCode: android.defaultConfig.versionCode, files: hashes
        ]))
    }
}
tasks.named('preBuild').configure { dependsOn 'packageLicenseNotices', 'generateSourceManifest' }
